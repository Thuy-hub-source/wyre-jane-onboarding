<body>
<header><img class="brand" src="wyre-logo.png" alt="Wyre"><div class="tag">INTERNAL ONBOARDING<br>GETTING STARTED WITH JANE</div><button class="back mode" id="theme" aria-label="Switch colour theme">Dark view</button><div class="prog"><div class="tag" id="pl">PROGRESS 0%</div><div class="track" role="progressbar" aria-label="Module progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div class="bar" id="bar"></div></div></div></header>
<main><div class="review"><span id="mode">REVIEW VERSION · No LMS tracking in this preview</span><span id="module-count"></span></div><section id="content" aria-live="polite"></section></main>
<footer class="bottom"><button id="back" class="back">Back</button><label><span class="hide">Jump to a screen</span><select id="menu" aria-label="Jump to a screen"></select></label><button id="next" class="next">Get started</button></footer>
<dialog id="visual-dialog" aria-labelledby="zoom-title">
  <div class="zoom-head"><h2 id="zoom-title">Presentation illustration</h2><button id="zoom-size" class="back">Original size</button><button id="zoom-close" class="next">Close</button></div>
  <div class="zoom-scroll"><img id="zoom-image" alt=""></div>
  <p class="zoom-help">Illustration from the supplied presentation, not a live application screen. At original size, scroll to inspect details. Press Escape to close.</p>
</dialog>
<script src="data.js"></script>
<script src="visuals.js"></script>
<script src="learning.js"></script>
<script>
const el=id=>document.getElementById(id);
el('module-count').textContent=slides.length+' screens · Guided practice · '+quiz.length+' quiz questions';
let p=0,qi=0,score=0,locked=false,API=null,initialized=false,status='',attemptStarted=false;
function findAPI(w){for(let i=0;i<10&&w;i++){try{if(w.API)return w.API;if(w.parent&&w.parent!==w)w=w.parent;else break}catch(e){break}}return null}
try{API=findAPI(window)||findAPI(window.opener)}catch(e){}
function get(k){try{return initialized?API.LMSGetValue(k):''}catch(e){return ''}}
function set(k,v){try{if(initialized)API.LMSSetValue(k,String(v))}catch(e){}}
function commit(){try{if(initialized)API.LMSCommit('')}catch(e){}}
if(API){try{initialized=String(API.LMSInitialize(''))==='true';if(initialized){status=get('cmi.core.lesson_status');if(!status||status==='not attempted'){status='incomplete';set('cmi.core.lesson_status',status)}const loc=get('cmi.core.lesson_location');if(loc&&Number.isInteger(+loc))p=Math.max(0,Math.min(+loc,slides.length-1));el('mode').textContent='LMS MODE · SCORM 1.2 connection active'}}catch(e){}}
function save(){set('cmi.core.lesson_location',Math.min(p,slides.length-1));set('cmi.core.exit','suspend');commit()}
function text(tag,txt,cls){const n=document.createElement(tag);n.textContent=txt;if(cls)n.className=cls;return n}
slides.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+s[0];el('menu').append(o)});
el('menu').onchange=()=>{p=+el('menu').value;qi=0;score=0;render()};
function progress(value){el('bar').style.width=value+'%';el('pl').textContent='PROGRESS '+value+'%';el('progress').setAttribute('aria-valuenow',value)}
function showVisual(v){
  const d=el('visual-dialog'),img=el('zoom-image');
  el('zoom-title').textContent=v.title;img.src=v.src;img.alt=v.alt;img.classList.remove('actual-size');
  el('zoom-size').textContent='Original size';d.showModal();el('zoom-close').focus();
  d.querySelector('.zoom-scroll').scrollTo(0,0);
}
el('zoom-close').onclick=()=>el('visual-dialog').close();
el('visual-dialog').addEventListener('click',e=>{if(e.target===el('visual-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});
el('zoom-size').onclick=()=>{const original=el('zoom-image').classList.toggle('actual-size');el('zoom-size').textContent=original?'Fit to window':'Original size'};
function addVisual(container){
  const v=presentationVisuals[p];if(!v)return;
  const figure=document.createElement('figure');figure.className='visual-card'+(p===10||p===17?'':' narrow');
  const head=text('div','','visual-heading'),label=document.createElement('div');
  label.append(text('h2',v.title),text('p','PRESENTATION ILLUSTRATION · SLIDE '+v.source,'visual-source'));
  const open=text('button','Enlarge image','back');open.setAttribute('aria-haspopup','dialog');open.onclick=()=>showVisual(v);
  head.append(label,open);
  const frame=text('div','','visual-frame'),img=document.createElement('img');img.src=v.src;img.alt=v.alt;img.className='visual-image';frame.append(img);
  const caption=text('figcaption','','visual-caption');caption.append(text('p',v.note),text('p',v.provenance,'visual-source'));
  figure.append(head,frame,caption);container.append(figure);
}
function copyBlocks(value){
  const copy=text('div','','copy');
  value.split('\n\n').forEach(block=>{
    const lines=block.split('\n'),list=lines.length>1&&lines.every(l=>/^(\u2022 |\d+\. )/.test(l));
    if(list){const ul=document.createElement(/^\d/.test(lines[0])?'ol':'ul');lines.forEach(l=>ul.append(text('li',l.replace(/^(\u2022 |\d+\. )/,''))));copy.append(ul)}
    else{const para=text('p',''),colon=block.indexOf(':');if(colon>0&&colon<48&&!block.slice(0,colon).includes('\n')){para.append(text('strong',block.slice(0,colon+1)),document.createTextNode(block.slice(colon+1)))}else para.textContent=block;copy.append(para)}
  });
  return copy;
}
function welcomeView(card,container){
  const intro=text('div','','visual-intro'),b=text('button','View application illustrations','next');
  b.onclick=()=>{p=9;render()};intro.append(b,text('p','7 presentation illustrations. Explore at your own pace.'));card.append(intro);
  const layout=text('div','','welcome-layout'),stage=text('div','','product-stage'),label=text('div','','stage-label');
  label.append(text('strong','JANE'),text('span','Change Request Board'));
  const frame=text('div','','stage-window'),img=document.createElement('img');img.src=presentationVisuals[10].src;img.alt=presentationVisuals[10].alt;frame.append(img);
  const foot=text('div','','stage-foot'),zoom=text('button','Take a closer look','back');zoom.onclick=()=>showVisual(presentationVisuals[10]);
  foot.append(text('span','Illustration from the Wyre presentation'),zoom);stage.append(label,frame,foot);layout.append(card,stage);container.append(layout);
  const outcomes=text('div','','outcomes');
  [['01','Start correctly','Choose your route and submit a clear request.',9],['02','Follow your change','Understand statuses and ownership.',10],['03','Work together','Keep comments, files and information useful.',14]].forEach(([n,title,description,target])=>{
    const button=text('button','','outcome');button.append(text('span',n),text('strong',title),text('p',description));button.onclick=()=>{p=target;render()};outcomes.append(button);
  });container.append(outcomes);
}
let practiceIndex=0,practiceCompleted=false,practicePhase=0;
const practiceDraft={title:'Improve the form',problem:'',outcome:'',value:''};
const draftFields=[
  ['title','Request title',0,'The title names the change rather than just asking for an improvement.'],
  ['problem','Current problem',1,'The problem explains what happens now and who is affected.'],
  ['outcome','Desired outcome',2,'The outcome describes what should happen differently.'],
  ['value','Expected value',4,'The value is motivated; any assumed figures are clearly labelled for validation.']
];
function trainingNotice(container,title,message){const n=text('div','','training-notice');n.append(text('strong',title),text('span',message));container.append(n)}
function showWorkedExample(container){
  trainingNotice(container,'Fictional training example','No live request is created. Field labels below are drafting prompts, not verified JANE form fields. Real values, approvals and Components must be validated.');
  const sheet=document.createElement('dl');sheet.className='example-sheet';
  workedRequest.forEach(([label,value])=>{const row=text('div','','example-row');row.append(text('dt',label),text('dd',value));sheet.append(row)});container.append(sheet);
}
function showPractice(container){
  const shell=text('div','','practice-shell');container.append(shell);
  function draw(){
    shell.replaceChildren();
    if(practicePhase===0){
      const card=text('div','','card');card.append(text('div','DRAFT THE REQUEST','ey'),text('h2','Turn a vague request into a useful draft.'),text('p','Exercise scenario: an internal form accepts requests without a reference number. One team then has to follow up manually. Use the fictional assumptions in the worked example; do not enter real confidential information.','practice-scenario'));
      const form=document.createElement('form');form.className='draft-form';
      draftFields.forEach(([key,label])=>{
        const field=document.createElement(key==='title'?'input':'textarea'),id='draft-'+key,l=text('label',label);l.htmlFor=id;field.id=id;field.name=key;field.required=true;field.value=practiceDraft[key];field.maxLength=2000;field.oninput=()=>{practiceDraft[key]=field.value;field.setCustomValidity(field.value.trim()?'':'Enter your draft text.');};form.append(l,field);
      });
      const compare=text('button','Compare my draft','continue');compare.type='submit';form.append(compare);
      form.onsubmit=e=>{e.preventDefault();if(draftFields.some(([key])=>!practiceDraft[key].trim()))return;practicePhase=1;draw();shell.scrollIntoView({block:'start'})};
      card.append(form,text('p','Your draft stays in this page session only. It is not sent to JANE or recorded as an LMS answer.','visual-source'));shell.append(card);return;
    }
    if(practicePhase===1){
      const card=text('div','','card');card.append(text('div','COMPARE AND IMPROVE','ey'),text('h2','Check your draft against the example.'),text('p','There is no automatic judgement of your wording. Compare each part and confirm the checklist honestly. The example figures are fictional, not Wyre business data.'));
      const checks=[];
      draftFields.forEach(([key,label,index,criterion])=>{
        const row=text('section','','draft-compare');row.append(text('h3',label),text('small','YOUR DRAFT'),text('p',practiceDraft[key]),text('small','WORKED EXAMPLE'),text('p',workedRequest[index][1]));
        const check=document.createElement('input');check.type='checkbox';check.setAttribute('aria-label',criterion);
        const l=text('label','','self-check');l.append(check,text('span',criterion));row.append(l);checks.push(check);card.append(row);
      });
      const proceed=text('button','Practise the next decisions','continue');proceed.disabled=true;
      checks.forEach(check=>check.onchange=()=>proceed.disabled=!checks.every(c=>c.checked));
      proceed.onclick=()=>{practicePhase=2;draw();shell.scrollIntoView({block:'start'})};
      const edit=text('button','Edit my draft','back');edit.style.marginRight='12px';edit.onclick=()=>{practicePhase=0;draw()};
      card.append(edit,proceed);shell.append(card);return;
    }
    if(practiceCompleted){
      const card=text('div','','card');card.append(text('div','PRACTICE COMPLETE','ey'),text('h2','One draft. Three decisions.'),text('p','You drafted and self-reviewed a request, then practised assessing the route and responding to Form Incomplete. This guided exercise is not proof of live JANE proficiency; the final quiz is separate.'));
      const again=text('button','Practise again','back');again.onclick=()=>{practiceIndex=0;practiceCompleted=false;practicePhase=0;draw()};card.append(again);shell.append(card);return;
    }
    const step=practiceSteps[practiceIndex],card=text('div','','card');
    card.append(text('div','DECISION '+(practiceIndex+1)+' OF '+practiceSteps.length,'ey'),text('h2',step.title),text('p',step.scenario,'practice-scenario'));
    const options=text('div','','practice-options'),fb=text('div','','practice-feedback hide');fb.setAttribute('role','status');
    step.choices.forEach((choice,i)=>{
      const button=text('button',String.fromCharCode(65+i)+'. '+choice,'choice');button.onclick=()=>{
        const correct=i===step.correct;fb.className='practice-feedback '+(correct?'ok':'no');fb.replaceChildren(text('p',step.feedback[i]));
        [...options.children].forEach(b=>b.classList.remove('no'));
        button.classList.add(correct?'ok':'no');
        if(correct){
          [...options.children].forEach(b=>b.disabled=true);
          const next=text('button',practiceIndex===practiceSteps.length-1?'Finish practice':'Next decision','continue');
          next.onclick=()=>{if(practiceIndex===practiceSteps.length-1)practiceCompleted=true;else practiceIndex++;draw();shell.scrollIntoView({block:'start'})};fb.append(next);next.focus();
        }else fb.append(text('p','Try another answer. Use the feedback to decide.'));
      };options.append(button);
    });card.append(options,fb);shell.append(card);
  }draw();
}
function showValidation(container){
  trainingNotice(container,'Review version: process-owner sign-off pending','These are open validation points for Philippe and Eveline or the designated Wyre process owner, not confirmed operating rules. Do not treat this review module as the final production procedure.');
  const grid=text('div','','validation-grid');
  validationPoints.forEach(([title,observation,action])=>{
    const card=text('section','','validation-card');card.append(text('span','TO CONFIRM','pending'),text('h2',title),text('p',observation),text('p',action));grid.append(card);
  });container.append(grid);
}
function render(){
  const c=el('content');c.replaceChildren();el('back').classList.toggle('hide',p===0||p>slides.length);el('next').classList.toggle('hide',p>=slides.length);el('menu').value=Math.min(p,slides.length-1);
  el('next').textContent=p===0?'Get started':p===slides.length-1?'Start quiz':'Continue';progress(Math.round(Math.min(p,slides.length)/(slides.length+1)*100));
  if(p===slides.length){showQ();return}
  const s=slides[p],card=text('div','','hero'+(p===0?' welcome':''));card.append(text('div',s[2].toUpperCase(),'ey'),text('h1',s[0]));
  if(p===0){card.append(text('p',s[1],'lead'));welcomeView(card,c)}
  else if(p>=20&&p<=22){
    card.append(text('p',s[1],'lead'));c.append(card);
    if(p===20)showWorkedExample(c);else if(p===21)showPractice(c);else showValidation(c);
  }else if(presentationVisuals[p]){
    c.append(card);const layout=text('div','','lesson-layout');addVisual(layout);
    const notes=text('aside','','lesson-notes');notes.append(text('h2','What to do'),copyBlocks(s[1]));layout.append(notes);c.append(layout);
  }else{
    c.append(card);const layout=text('div','','reading-layout'),side=text('aside','','chapter-caption');
    side.append(text('span',String(p+1).padStart(2,'0'),'section-number'),text('span',s[2]));
    const body=text('div','','reading-copy');body.append(copyBlocks(s[1]));layout.append(side,body);c.append(layout);
  }
  const pending={
    3:'The presentation shows different Design/Planning sequences in its governance and Jira-status diagrams. The process owner must confirm how they relate.',
    5:'The presentation provides five governance criteria and eight IT criteria. Their relationship must be confirmed by the process owner.',
    6:'These eight criteria come from the IT reference slide. Confirm how they relate to the five governance criteria before applying them to a real request.',
    11:'The status sequence differs from the governance sequence in the presentation. Confirm the actual JANE workflow before using this as a production reference.',
    18:'The Component examples in the presentation are marked as not final. Use only currently approved values in the real application.'
  };
  if(pending[p])trainingNotice(c,'Process-owner validation pending',pending[p]);
  save();window.scrollTo(0,0);
}
function showQ(){locked=false;el('content').replaceChildren();el('content').append(text('div','FINAL QUIZ','ey'),text('h1','Check your understanding.'));const meta=text('div','Question '+(qi+1)+' of '+quiz.length+' · Pass mark: 80%','quizmeta');const card=document.createElement('div');card.className='card';card.append(text('h2',quiz[qi][0]));const opts=document.createElement('div');opts.id='opts';quiz[qi][1].forEach((s,i)=>{const b=text('button',String.fromCharCode(65+i)+'. '+s,'choice');b.onclick=()=>grade(i);opts.append(b)});card.append(opts);const fb=document.createElement('div');fb.id='fb';fb.setAttribute('role','status');card.append(fb);el('content').append(meta,card);window.scrollTo(0,0)}
function grade(i){if(locked)return;locked=true;const z=quiz[qi],ok=i===z[2];if(ok)score++;[...el('opts').children].forEach((b,j)=>{b.disabled=true;if(j===z[2])b.classList.add('ok');if(j===i&&!ok)b.classList.add('no')});const fb=el('fb');fb.className='feedback '+(ok?'ok':'no');fb.append(text('p',(ok?'Correct. ':'Not quite. ')+z[3]));const b=text('button',qi===quiz.length-1?'See result':'Next question','continue');b.onclick=()=>{if(qi<quiz.length-1){qi++;showQ()}else result()};fb.append(b);b.focus()}
function result(){p=slides.length+1;const pct=Math.round(score/quiz.length*100),pass=pct>=80;set('cmi.core.score.min',0);set('cmi.core.score.max',100);set('cmi.core.score.raw',pct);status=pass?'passed':'failed';set('cmi.core.lesson_status',status);set('cmi.core.exit','');commit();progress(100);el('back').classList.add('hide');el('next').classList.add('hide');const card=document.createElement('div');card.className='hero welcome';card.append(text('div','FINAL RESULT','ey'),text('h1',pass?'Congratulations':'Almost there'),text('p',pass?'You passed the JANE onboarding assessment.':'You need 80% to pass. Review the feedback and try again.','lead'),text('p',pct+'%','score'));const b=text('button','Retake quiz','continue');b.onclick=()=>{qi=0;score=0;p=slides.length;render()};card.append(b);el('content').replaceChildren(card);window.scrollTo(0,0)}
el('next').onclick=()=>{if(p<slides.length){p++;if(p===slides.length){qi=0;score=0;attemptStarted=true}render()}};
el('back').onclick=()=>{if(p>0){p--;qi=0;score=0;render()}};
let dark=false;function theme(){document.documentElement.dataset.theme=dark?'dark':'light';el('theme').textContent=dark?'Light view':'Dark view'}el('theme').onclick=()=>{dark=!dark;theme()};theme();
let finished=false;function finish(){if(finished)return;finished=true;if(p<=slides.length)save();try{if(initialized)API.LMSFinish('')}catch(e){}}
window.addEventListener('pagehide',finish);window.addEventListener('beforeunload',finish);render();
</script></body></html>
